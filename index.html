<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Huerta del Loncco — Picantería arequipeña en Yanahuara, Arequipa</title>
<meta name="description" content="Picantería arequipeña y cocina de autor en Yanahuara, Arequipa. Platos de las 8 provincias, coctelería de autor y arpa en vivo. Reservas y pedidos directos.">
<meta property="og:title" content="La Huerta del Loncco — El alma de Arequipa en cada bocado">
<meta property="og:description" content="Picantería arequipeña y cocina de autor en Calle La Recoleta 220, Yanahuara, Arequipa.">
<meta property="og:image" content="img/chupe-de-camaron.jpg">
<link rel="icon" type="image/png" href="img/logo-verde.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&amp;family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,500&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
html{scroll-behavior:smooth}
a{color:#475a29}a:hover{color:#3d792f}
:focus-visible{outline:2px solid #475a29;outline-offset:2px}
.osc :focus-visible{outline-color:#bcc785}
button{font:inherit;cursor:pointer}
input{font:inherit}
.dos-col{background-image:linear-gradient(#475a29,#475a29);background-size:1px 100%;background-position:center top;background-repeat:no-repeat}
@keyframes bandIn{from{transform:translateX(64px);opacity:0}to{transform:none;opacity:1}}
.bandIn{animation:bandIn .8s cubic-bezier(.2,.7,.2,1) both}
.band-link{transition:padding-left .25s ease}
.band-link:hover{padding-left:48px !important}
.prov{transition:fill .2s ease,transform .25s ease}.prov:hover{fill:#f7f2e9}
.placa:hover{background:#d69a5e !important}
@media (prefers-reduced-motion:reduce){.bandIn{animation:none}.band-link,.prov{transition:none}html{scroll-behavior:auto}}
@media (max-width:760px){.dos-col{background-image:none;grid-template-columns:minmax(0,1fr) !important}.h1{font-size:52px !important}.band-title{font-size:30px !important}}
</style>
<style>#app.listo .bandIn{animation:none}</style>
</head>
<body>
<div id="app"></div>
<template id="plantilla">
<div id="top" style="font-family: Roboto, 'Helvetica Neue', Arial, sans-serif; color: #1d1d1b; background: #ffffff; min-height: 100vh; overflow-x: hidden">

<!-- ================= PORTADA: el índice de la carta ================= -->
<header class="osc" style="position: relative; isolation: isolate; overflow: hidden; background: #152808; color: #e9edd9">
<img src="img/grabado-claro.png" alt="" aria-hidden="true" style="position: absolute; z-index: -1; left: -40px; bottom: -30px; width: min(1100px, 90%); opacity: 0.13; pointer-events: none">
<div style="padding: 20px clamp(24px, 5vw, 72px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px">
<a href="#top" style="text-decoration: none; display: flex; align-items: center"><img src="img/logo-blanco.png" alt="La Huerta del Loncco, inicio" style="width: 92px; height: auto; display: block"></a>
<nav aria-label="{{t.navLabel}}" style="display: flex; flex-wrap: wrap; gap: 0 28px; font-size: 15px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" style="color: #e9edd9; text-decoration: none; padding: 12px 0">{{n.label}}</a>
</sc-for>
</nav>
<div style="display: flex; align-items: center; gap: 10px">
<div role="group" aria-label="Idioma / Language" style="display: flex; border: 1px solid #4a6233; border-radius: 8px; overflow: hidden">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
<sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" lang="{{l.code}}" onClick="{{l.pick}}" style="min-width: 76px; min-height: 44px; border: 0; background: #bcc785; color: #152808; font-size: 14px; font-weight: 500">{{l.label}}</button>
</sc-if>
<sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
<button type="button" aria-pressed="false" lang="{{l.code}}" onClick="{{l.pick}}" style="min-width: 76px; min-height: 44px; border: 0; background: transparent; color: #e9edd9; font-size: 14px">{{l.label}}</button>
</sc-if>
</sc-for>
</div>
<a href="#pedidos" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid #4a6233; border-radius: 8px; color: #e9edd9; text-decoration: none; font-size: 14px">{{cartLabel}}</a>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: stretch">
<div style="flex: 1 1 460px; min-width: 0; padding: 72px clamp(24px, 5vw, 72px) 88px; display: flex; flex-direction: column; justify-content: center; gap: 28px; box-sizing: border-box">
<h1 class="h1" style="margin: 0; font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-size: 84px; line-height: 0.95; font-weight: 600; color: #e9edd9; max-width: 9.5em; text-wrap: balance">{{t.heroTitle}}</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.65; font-weight: 300; max-width: 30em; text-wrap: pretty">{{t.heroText}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="#reservas" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 30px; background: #bcc785; color: #152808; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 16px">{{t.reserveBtn}}</a>
<a href="#pedidos" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 26px; border: 1px solid #bcc785; color: #e9edd9; border-radius: 8px; text-decoration: none; font-size: 16px">{{t.orderBtn}}</a>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.6; font-weight: 300; color: #bcc785; max-width: 30em">{{t.press}}</p>
</div>

<nav aria-label="{{t.indexLabel}}" style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 48px 0">
<sc-for list="{{heroBands}}" as="b" hint-placeholder-count="4">
<a class="bandIn band-link" href="#carta" onClick="{{b.pick}}" style="{{b.style}}">
<span class="band-title" style="font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-size: 44px; line-height: 1; font-weight: 700; letter-spacing: 0.04em">{{b.label}}</span>
<span style="font-size: 15px; font-weight: 300; font-style: italic">{{b.hint}}</span>
</a>
</sc-for>
</nav>
</div>
</header>

<!-- ================= NOSOTROS ================= -->
<section id="nosotros" aria-labelledby="h-nos" style="position: relative; isolation: isolate; max-width: 1200px; margin: 0 auto; padding: 120px 24px 96px; display: flex; flex-wrap: wrap; gap: 72px; align-items: center">
<img class="deco" src="img/grabado-gris.png" alt="" aria-hidden="true" style="position: absolute; z-index: -1; right: -120px; top: 20px; width: 640px; opacity: 0.4; pointer-events: none">
<div style="flex: 1 1 340px; display: flex; justify-content: center">
<div style="width: 100%; max-width: 400px; aspect-ratio: 4 / 5; border-radius: 999px 999px 0 0; background: #e9edd9; display: flex; align-items: center; justify-content: center; overflow: hidden">
<img src="img/chupe-de-camaron.jpg" alt="{{t.chupeAlt}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
</div>
</div>
<div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<h2 id="h-nos" style="margin: 0; font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-size: 56px; line-height: 1; font-weight: 700; color: #475a29; text-wrap: balance">{{t.aboutTitle}}</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.8; font-weight: 300; max-width: 36em; text-wrap: pretty">{{t.about1}}</p>
<p style="margin: 0; font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-size: 26px; line-height: 1.3; font-style: italic; font-weight: 600; color: #475a29">{{t.about2}}</p>
</div>
</section>


<!-- ================= MAPA DE PROVINCIAS ================= -->
<section id="provincias" aria-labelledby="h-prov" class="osc" style="background: #152808; color: #e9edd9; padding: 104px 24px 112px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 40em">
<h2 id="h-prov" style="margin: 0; font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-size: 60px; line-height: 0.98; font-weight: 700; color: #e9edd9; text-wrap: balance">{{t.mapTitle}}</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.6; font-weight: 300">{{t.mapSub}}</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 999 1 620px; min-width: 0">
<div style="position: relative; width: 100%; aspect-ratio: 1370 / 1000">
<svg role="img" aria-label="{{t.mapAlt}}" viewBox="40 80 1370 1000" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible">

    var horas = horaList.map(function (h) { return { label: h, on: s.hora === h, off: s.hora !== h, pick: function () { self.setState({ hora: h }); } }; });
    var dayLong = dayObjs[s.day].toLocaleDateString(loc, { weekday: 'long', day: 'numeric', month: 'long' });
    var tipoSel = tipoDefs.filter(function (x) { return x.id === s.tipo; })[0] || tipoDefs[0];
    var sumLine = (en ? tipoSel.en : tipoSel.es) + L(' para ', ' for ') + s.personas + ' ' + (s.personas === 1 ? L('persona', 'guest') : L('personas', 'guests'));
    var nombre1 = (s.nombre || '').trim().split(' ')[0];
    var resDoneText = s.tipo === 'mesa'
      ? L(nombre1 + ', su mesa para ' + s.personas + ' está reservada el ' + dayLong + ' a las ' + s.hora + '. Les enviamos la confirmación al WhatsApp ' + s.telefono + '.',
          nombre1 + ', your table for ' + s.personas + ' is booked for ' + dayLong + ' at ' + s.hora + '. We have sent the confirmation to WhatsApp ' + s.telefono + '.')
      : L(nombre1 + ', recibimos su solicitud para ' + s.personas + ' personas el ' + dayLong + '. Les escribimos al ' + s.telefono + ' con opciones de menú, maridaje y la cotización.',
          nombre1 + ', we have your request for ' + s.personas + ' guests on ' + dayLong + '. We will message ' + s.telefono + ' with menu, pairing options and a quote.');

    var modos = [{ id: 'delivery', es: 'Delivery', en: 'Delivery' }, { id: 'recojo', es: 'Recojo en el local', en: 'Pick-up' }].map(function (m) {
      return { label: en ? m.en : m.es, on: s.modo === m.id, off: s.modo !== m.id, pick: function () { self.setState({ modo: m.id }); } };
    });
    var pagos = [{ id: 'yape', label: 'Yape' }, { id: 'plin', label: 'Plin' }, { id: 'tarjeta', label: L('Tarjeta', 'Card') }].map(function (p) {
      return { label: p.label, on: s.pago === p.id, off: s.pago !== p.id, pick: function () { self.setState({ pago: p.id }); } };
    });
    var pagoTxt = s.pago === 'tarjeta' ? L('tarjeta', 'card') : (s.pago === 'yape' ? 'Yape' : 'Plin');
    var orderDoneText = s.modo === 'delivery'
      ? L('Su pedido de ' + platos(cartCount) + ' ya está en nuestra cocina. Pago con ' + pagoTxt + '. Les avisamos por WhatsApp cuando salga hacia su dirección.',
          'Your order of ' + platos(cartCount) + ' is in our kitchen. Paying by ' + pagoTxt + '. We will message you on WhatsApp when it leaves for your address.')
      : L('Su pedido de ' + platos(cartCount) + ' ya está en nuestra cocina. Pago con ' + pagoTxt + '. Les avisamos cuando esté listo para recoger.',
          'Your order of ' + platos(cartCount) + ' is in our kitchen. Paying by ' + pagoTxt + '. We will let you know when it is ready to collect.');

    var eventos = [
      { t: L('Almuerzos de empresa', 'Company lunches'), d: L('Menú cerrado, maridaje y factura para su equipo y sus clientes.', 'Set menu, pairings and invoicing for your team and clients.'), photo: L('[Foto: mesa larga en el patio]', '[Photo: long table on the patio]') },
      { t: L('Celebraciones', 'Celebrations'), d: L('Cumpleaños, bautizos y reuniones familiares con arpa en vivo.', 'Birthdays, christenings and family gatherings with live harp.'), photo: L('[Foto: celebración familiar]', '[Photo: family celebration]') },
      { t: L('Grupos de turismo', 'Tour groups'), d: L('Almuerzo arequipeño para agencias y grupos, con carta en inglés.', 'Arequipa lunch for agencies and groups, with an English menu.'), photo: L('[Foto: grupo en el salón]', '[Photo: group in the dining room]') }
    ];

    return {
      t: t, langs: langs, nav: nav, provincias: provincias, prov: prov, mp: mp, selD: MAPD[s.prov] || '', heroBands: heroBands,
      cartLabel: L('Su pedido', 'Your order') + (cartCount ? ' (' + cartCount + ')' : ''),
      cats: cats, dishes: dishes, noDishes: dishes.length === 0,
      vegOnly: s.veg, vegAll: !s.veg, toggleVeg: function () { self.setState({ veg: !self.state.veg }); },
      catTitle: en ? curCat.en : curCat.es, catIntro: en ? curCat.introEn : curCat.introEs,
      bandStyle: 'flex: 0 1 760px; min-height: 64px; background: ' + curCat.color + '; display: flex; align-items: center; padding: 0 24px 0 clamp(24px, 12%, 200px); box-sizing: border-box',
      bandTitleStyle: 'margin: 0; font-family: \'Cormorant Garamond\', Garamond, Georgia, serif; font-size: 36px; line-height: 64px; font-weight: 700; letter-spacing: 0.18em; color: ' + curCat.fg,
      cartCount: cartCount, cartItems: cartItems, cartEmpty: cartCount === 0, cartFull: cartCount > 0,
      cartSummary: platos(cartCount) + L(' en su pedido', ' in your order'),
      tipos: tipos, days: days, horas: horas, personas: s.personas,
      sumDay: cap(dayLong), sumHour: s.hora, sumLine: sumLine,
      lessP: function () { self.setState({ personas: Math.max(1, self.state.personas - 1) }); },
      moreP: function () { self.setState({ personas: Math.min(120, self.state.personas + 1) }); },
      nombre: s.nombre, telefono: s.telefono,
      onNombre: function (e) { self.setState({ nombre: e.target.value }); },
      onTelefono: function (e) { self.setState({ telefono: e.target.value }); },
      resError: s.resError,
      submitRes: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        var st = self.state;
        if (!st.nombre.trim() || st.telefono.replace(/\D/g, '').length < 6) { self.setState({ resError: true }); return; }
        self.setState({ resError: false, resDone: true });
      },
      resOpen: !s.resDone, resDone: s.resDone, resDoneText: resDoneText,
      resetRes: function () { self.setState({ resDone: false }); },
      pickEvento: function () { self.setState({ tipo: 'evento', personas: Math.max(self.state.personas, 15), resDone: false }); },
      modos: modos, pagos: pagos, isDelivery: s.modo === 'delivery', isPickup: s.modo === 'recojo',
      direccion: s.direccion, onDireccion: function (e) { self.setState({ direccion: e.target.value }); },
      sendOrder: function () { self.setState({ orderDone: true }); },
      orderOpen: !s.orderDone, orderDone: s.orderDone, orderDoneText: orderDoneText,
      resetOrder: function () { self.setState({ orderDone: false, cart: {} }); },
      eventos: eventos
    };
  }
}
</script>
<noscript><p style="font-family: sans-serif; padding: 24px">La Huerta del Loncco, Calle La Recoleta 220, Yanahuara, Arequipa. Activen JavaScript para ver la carta, reservar y pedir.</p></noscript>
</body>
